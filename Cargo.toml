[workspace]
members = [
    "crates/gamersequalizer-common",
    "crates/gamersequalizer-daemon",
    "crates/gamersequalizer-mic-chain",
    "crates/gamersequalizer-apo",
]
# Third-party forks, built only as dependencies of our crates (not linted as our code).
exclude = ["crates/vendor/deep_filter", "crates/vendor/rnnoise2", "crates/vendor/silero_vad", "crates/vendor/egui-wgpu"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    # SHA-256 of the elevated scripts (`apo_install/elevated.rs`).
    "Win32_Security_Cryptography",
    "Win32_System_Performance",
    # Threads of the own process, for the `cpu-stats` diagnostic build (`cpu_stats.rs`).
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    # Notes from inside audiodg to the Application log (`gamersequalizer-apo` `event_log.rs`).
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    # Console session check (`console_owner.rs`).
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    # A packaged app's ID, for its logo in the tray flyout (`flyout.rs`).
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_Controls_Dialogs",
    # The tray flyout draws itself into a plain popup (`flyout/paint.rs`): GDI, rounded corners from DWM.
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Audio_Apo",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    # Toast notifications (`notify.rs`).
    "UI_Notifications",
    "Data_Xml_Dom",
] }
windows-core = "0.62"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Library only: default features build the CLI (clap, hound, dasp: ~27 crates).
nnnoiseless = { version = "0.5", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
# Since 0.37 the bundled emoji fonts are a separate feature; `theme::with_icon` (icon buttons) and the
# fallback without Segoe Fluent Icons draw emoji, which render as empty squares without it.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# Same wgpu eframe 0.37 uses (egui-wgpu turns its default features off); only adds the DX12 backend.
wgpu = { version = "30", default-features = false, features = ["dx12"] }
egui_plot = "0.38"
# Default features only add the Linux GTK 3 / libappindicator backend (glib 0.18, RUSTSEC-2024-0429).
tray-icon = { version = "0.26", default-features = false }
muda = { version = "0.21", default-features = false }
log = "0.4"
# Own format (app_log.rs) to a pipe: no colors, no regex filters, no humantime.
env_logger = { version = "0.11", default-features = false }

# Dev iterations: optimized but parallel and incremental (all cores, seconds after a small
# change). Fat LTO with one codegen unit took ~2.5 min single-threaded for little gain.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = true
panic = "abort"
strip = true

# Final distribution build: whole-program optimization, slow.
#   cargo build --profile dist -p gamersequalizer
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Dependencies (not our crates) are built optimized and without debug assertions even in
# dev builds: tract's debug-only graph check rejects the DeepFilterNet 3 model
# ("duplicate name /convt3/Conv.bias") that loads and runs fine in release.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false

# The capture APO runs inside audiodg.exe: it is built with unwinding so its catch_unwind
# guards turn a DSP panic into pass-through audio instead of killing system audio.
#   cargo build --profile apo -p gamersequalizer-apo   -> target/apo/gamersequalizer_apo.dll
[profile.apo]
inherits = "release"
panic = "unwind"

# The APO for testers: `dist` optimization (fat LTO, one codegen unit), still unwinding.
#   cargo build --profile apo-dist -p gamersequalizer-apo   (scripts/package.ps1)
[profile.apo-dist]
inherits = "dist"
panic = "unwind"

# The no-panic rules from `.claude/rules/code-style.md`, enforced (they held only by discipline).
# Not `unsafe_code = "deny"`: the app is Win32 / COM / APO FFI throughout; each `unsafe` block
# carries a SAFETY comment instead. Tests may unwrap/expect/panic/index (`clippy.toml`).
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"
let_underscore_future = "deny"
clone_on_copy = "deny"
needless_return = "deny"
redundant_field_names = "deny"
undocumented_unsafe_blocks = "deny"

# tract 0.23.10 plus fixes merged upstream after it: an AVX-512 kernel for f16 model weights, a kernel
# choice that stops padding small matrix-vector products to 128 rows, and a 16x1 kernel fix (branch
# gamersequalizer-0.23.10 of github.com/PixCZ/tract). Without it the mic models' f16 weights run
# slower than f32 on AVX-512 CPUs. Drop it once a tract release carries them (how to check:
# .claude/rules/release.md, "tract version and our fork"). tract-data comes from the same commit
# because tract-linalg uses it by path there.
[patch.crates-io]
tract-linalg = { git = "https://github.com/PixCZ/tract", rev = "a5fe22538b3d442f23796568c35115964e3e2597" }
tract-data = { git = "https://github.com/PixCZ/tract", rev = "a5fe22538b3d442f23796568c35115964e3e2597" }
# egui-wgpu 0.37.0 with emilk/egui#8784 (fixes emilk/egui#8704): stock egui-wgpu keeps every
# enumerated adapter alive, and on DX12 each holds a device, so the window kept the NVIDIA GPU of
# hybrid laptops awake (and G-Helper / Armoury Crate end such apps in iGPU-only mode). Drop it once
# an egui release carries the fix (AGENTS.md, "Before a release"). See crates/vendor/egui-wgpu/README.md.
egui-wgpu = { path = "crates/vendor/egui-wgpu" }
