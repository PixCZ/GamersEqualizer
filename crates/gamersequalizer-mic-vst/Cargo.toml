[package]
name = "gamersequalizer-mic-vst"
version = "0.1.0"
edition = "2021"

[lib]
name = "gamersequalizer_mic_vst"
crate-type = ["cdylib", "rlib"]

[features]
# Debug builds only: the mic chain records every stage for the capture tool
# (`cargo run -p gamersequalizer-apo --example debug_capture`). Off in normal builds.
debug-capture = []

[dependencies]
gamersequalizer-common = { path = "../gamersequalizer-common" }
windows = { workspace = true }
windows-core = { workspace = true }
nnnoiseless = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rustfft = "6.4"
# Real-input FFT (delay estimator, DPDFNet STFT, latency meter; already in the tree via deep_filter).
realfft = "3.5"
# DeepFilterNet 3: our inference-only fork of upstream libDF (rev d375b2d) on tract 0.23, the
# tract DPDFNet uses too (upstream pins tract 0.21). See crates/vendor/deep_filter/README.md.
deep_filter = { path = "../vendor/deep_filter", features = ["tract", "default-model"] }
# DPDFNet (ONNX), exactly the tract the fork is built against.
tract-onnx-23 = { package = "tract-onnx", version = "=0.23.10" }
# Same version as tract 0.23 (the fork's DfTract takes these arrays).
ndarray = "0.17"
# Echo canceller: pure Rust port of WebRTC AEC3 (BSD-3), see src/aec3.rs.
sonora = "0.3"

[dev-dependencies]
# Reads the WAV fixtures in test_data/denoise (already in the lock file via other crates).
hound = "3.5"

[lints]
workspace = true
