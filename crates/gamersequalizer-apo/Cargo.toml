[package]
name = "gamersequalizer-apo"
version = "0.1.0"
license = "GPL-3.0-or-later"
authors = ["Jiří Němec"]
edition = "2021"
description = "Audio effects (mic chain, output EQ, per-app stream EQ) loaded by audiodg on the user's devices"

[lib]
crate-type = ["cdylib"]

[features]
# `scripts/dev-rebuild.ps1 -Apo -DebugCapture`: the APO records the mic chain on request.
debug-capture = ["gamersequalizer-mic-chain/debug-capture"]

[dependencies]
windows = { workspace = true }
windows-core = { workspace = true }
gamersequalizer-common = { path = "../gamersequalizer-common" }
gamersequalizer-mic-chain = { path = "../gamersequalizer-mic-chain" }
# Already in the build through deep_filter; resamples the mic chain at non-48 kHz rates.
rubato = "5"

[build-dependencies]
# Version resource in the DLL; the daemon already builds with it.
embed-resource = "3.0.12"

[lints]
workspace = true
