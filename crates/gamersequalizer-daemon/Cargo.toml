[package]
name = "gamersequalizer"
version = "0.1.0"
license = "GPL-3.0-or-later"
authors = ["Jiří Němec"]
edition.workspace = true

[[bin]]
name = "gamersequalizer"
path = "src/main.rs"

[dependencies]
gamersequalizer-common = { path = "../gamersequalizer-common" }
gamersequalizer-mic-chain = { path = "../gamersequalizer-mic-chain" }
windows = { workspace = true }
windows-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
wgpu = { workspace = true }
egui_plot = { workspace = true }
tray-icon = { workspace = true }
muda = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
# Local-time formatting (system time zone) for log lines, file names and the APO build stamp.
jiff = "1"
# Already in the tree via eframe (png) and deep_filter; compresses the settings export.
flate2 = "1"

[features]
# `scripts/dev-rebuild.ps1 -CpuStats`: once a minute the debug log says where the CPU time went
# (`cpu_stats.rs`). Never packaged.
cpu-stats = ["gamersequalizer-mic-chain/cpu-stats"]

[build-dependencies]
embed-resource = "3.0.12"

[lints]
workspace = true
