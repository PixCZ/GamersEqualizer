PackageIdentifier: OpenSonar.OpenSonar
PackageVersion: 0.1.0
PackageName: OpenSonar
Publisher: OpenSonar Team
License: MIT
ShortDescription: 100% pure Rust, air-gapped, zero-bloatware audio suite for Windows (SteelSeries Sonar alternative)
Description: |
  OpenSonar is a lightweight, zero-telemetry, pure Rust audio control center and equalizer for Windows.
  Features include classical mathematical Acoustic Echo Cancellation (AEC), offline AI voice isolation
  for keyboard clicks via nnnoiseless, virtual-less ChatMix, anti-monitor audio hijacking lock,
  and offline SteelSeries Sonar profile importer.
