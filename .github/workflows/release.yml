# Builds and optionally signs the Windows app on GitHub's runners.
# - Manual run (Actions tab -> Release -> Run workflow): tests, builds, uploads the zip as a
#   workflow artifact (kept 14 days).
# - Pushing a tag (git tag 0.1.0 && git push origin 0.1.0, or v0.1.0): the same, plus a GitHub
#   Release with the zip attached. The binaries then carry that version (About card, logs,
#   Explorer > Properties > Details); every other build carries the commit hash instead.
# - Code signing: repository secrets SIGNING_CERT_PFX_BASE64 and SIGNING_CERT_PASSWORD
#   (Settings -> Secrets and variables -> Actions). When present, gamersequalizer.exe and
#   gamersequalizer_apo.dll are signed and timestamped after the build; no certificate goes into
#   the zip.
# - The secrets reach only the `publish` job, a fresh runner that runs no cargo: build scripts and
#   proc macros of dependencies never run where the key is. Actions are pinned to commit SHAs.
# - Build provenance: the zip and both binaries (as shipped, after signing) get a GitHub-signed
#   attestation (SLSA, via Sigstore) naming this workflow and commit. Check a file with
#   `gh attestation verify gamersequalizer.exe -R PixCZ/GamersEqualizer`.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "[0-9].*"

permissions:
  contents: read

jobs:
  # Runs next to `build`, not before it: tests (release profile) and the package (dist + apo-dist,
  # each from scratch with fat LTO) are three full builds, too long in a row for one job.
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Test
        run: cargo test --workspace --release

      # Vendor forks are excluded from the workspace, so their tests run here. rnnoise2: its AVX2
      # kernel test needs an x86_64 runner. silero_vad: the port against onnxruntime's output.
      # deep_filter has no tests. Separate steps: pwsh checks only the last command's exit code.
      - name: Test rnnoise2
        run: cargo test --release --manifest-path crates/vendor/rnnoise2/Cargo.toml

      - name: Test silero_vad
        run: cargo test --release --manifest-path crates/vendor/silero_vad/Cargo.toml

  build:
    runs-on: windows-latest
    # Two from-scratch fat-LTO builds on a 4-core runner; 60 minutes were not enough.
    timeout-minutes: 120
    env:
      # A tag build shows the tag's version everywhere (About, logs, exe/DLL details); any other
      # build shows the commit hash (crates/build-support/version_info.rs).
      GAMERSEQUALIZER_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    outputs:
      pkg_name: ${{ steps.package.outputs.pkg_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Only the downloaded crates: package.ps1 cleans its profiles and builds from scratch, so a
      # cached target dir would only cost upload time.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-targets: false

      - name: Build and package (unsigned, no secrets)
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GAMERSEQUALIZER_RELEASE_VERSION) { $env:GAMERSEQUALIZER_RELEASE_VERSION.Trim().TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $pkgName = "GamersEqualizer-$version-x64"
          .\scripts\package.ps1 -NoSign -PackageName $pkgName
          "pkg_name=$pkgName" >> $env:GITHUB_OUTPUT

      # The staged files and build.txt, for the publish job (which signs and zips them).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged
          path: |
            target/package/staging/${{ steps.package.outputs.pkg_name }}
            target/package/${{ steps.package.outputs.pkg_name }}.build.txt
          retention-days: 1

  publish:
    # A failing test stops the release even though the package was built.
    needs: [test, build]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release on tags
      id-token: write # OIDC token for the Sigstore signature of the build provenance
      attestations: write # store the provenance attestation in the repo
    env:
      PKG_NAME: ${{ needs.build.outputs.pkg_name }}
    steps:
      # Only for scripts/sign-binaries.ps1; nothing here builds or runs cargo.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staged
          path: staged

      - name: Paths
        shell: pwsh
        run: |
          "STAGE=staged/staging/$env:PKG_NAME" >> $env:GITHUB_ENV
          "ZIP=out/$env:PKG_NAME.zip" >> $env:GITHUB_ENV
          "ZIP_NAME=$env:PKG_NAME.zip" >> $env:GITHUB_ENV
          "BUILD_TXT=out/$env:PKG_NAME.build.txt" >> $env:GITHUB_ENV


      - name: Sign
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          GAMERSEQUALIZER_PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if (-not ($env:PFX_B64 -and $env:PFX_B64.Trim())) {
            Write-Host "No SIGNING_CERT_PFX_BASE64 secret set; the package stays unsigned." -ForegroundColor Yellow
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64.Trim()))
          $bins = @("$env:STAGE/gamersequalizer.exe", "$env:STAGE/gamersequalizer_apo.dll")
          # Signs only the finished binaries; fails without a timestamp (CI is set).
          .\scripts\sign-binaries.ps1 -Files $bins -PfxPath $pfx -RequireTimestamp
          "SIGNED=1" >> $env:GITHUB_ENV

      # The zip and the hashes in build.txt describe the files as shipped (signed or not).
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path $env:STAGE -DestinationPath $env:ZIP
          $info = @(Get-Content "staged/$env:PKG_NAME.build.txt" | Where-Object { $_ -notmatch '^[0-9A-F]{64}  ' })
          $signed = if ($env:SIGNED) { 'signed   Authenticode SHA256, timestamped' } else { 'signed   no' }
          $hashes = Get-ChildItem $env:STAGE | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name }
          @($info + $signed + $hashes + "$((Get-FileHash $env:ZIP -Algorithm SHA256).Hash)  $env:ZIP_NAME") |
            Set-Content $env:BUILD_TXT

      # A private repository gets attestations only with GitHub Enterprise Cloud; without it this
      # step fails, which must not stop the release (its log says why).
      - name: Build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            ${{ env.ZIP }}
            ${{ env.STAGE }}/gamersequalizer.exe
            ${{ env.STAGE }}/gamersequalizer_apo.dll

      - name: Remove the signing key
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP }}
            ${{ env.BUILD_TXT }}
          retention-days: 14

      # Only the zip: build.txt (commit, flags, toolchain, hashes) stays in the workflow artifact.
      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
